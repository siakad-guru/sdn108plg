<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAKAD v1.0 - Pemeliharaan Sistem</title>
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1a4oMEH5GAaS2EmJdNSDlOdW0O8l4o4C9" type="image/png">

    <style>
        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #1e293b;
        }

        /* Header (judul aplikasi) */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: 0.2px;
        }

        /* Konten utama */
        .maintenance {
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 24px 48px;
            text-align: center;
        }

        .illustration {
            display: block;
            width: 100%;
            max-width: 340px;
            height: auto;
            margin: 0 auto;
        }

        .maintenance h1 {
            margin: 32px 0 18px;
            font-size: 1.45rem;
            line-height: 1.4;
            font-weight: 700;
            color: #0f2a4d;
        }

        .maintenance p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.65;
            color: #334155;
        }

        /* Kotak jadwal akses kembali */
        .info-box {
            margin: 26px 0;
            padding: 14px 16px;
            background-color: #eef4ff;
            border-radius: 10px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #1e293b;
        }
        .info-box strong {
            display: block;
            margin-top: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #2563eb;
        }
    </style>
</head>
<body>

    <header class="app-header">SIAKAD</header>

    <main class="maintenance">

        <!-- Ilustrasi -->
        <svg class="illustration" viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sistem sedang dalam pemeliharaan">
            <!-- Bayangan lantai -->
            <ellipse cx="180" cy="196" rx="165" ry="11" fill="#e8ecf2"/>

            <!-- Awan -->
            <g transform="translate(-22,-16)" fill="#dce9fa">
                <circle cx="52" cy="92" r="10"/>
                <circle cx="68" cy="84" r="14"/>
                <circle cx="86" cy="92" r="10"/>
                <rect x="42" y="90" width="54" height="12" rx="6"/>
            </g>
            <g transform="translate(150,10)" fill="#e6effb">
                <circle cx="52" cy="92" r="7"/>
                <circle cx="63" cy="86" r="10"/>
                <circle cx="76" cy="92" r="7"/>
                <rect x="45" y="90" width="38" height="9" rx="4.5"/>
            </g>

            <!-- Roda gigi besar + kunci pas -->
            <g transform="translate(250,45)">
                <circle r="22" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="6 5.52"/>
                <circle r="20" fill="#f59e0b"/>
                <circle r="11" fill="#fff7e6"/>
                <g transform="rotate(45)">
                    <line x1="0" y1="7" x2="0" y2="-2" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>
                    <path d="M-4.2 -2 A4.6 4.6 0 1 1 4.2 -2" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/>
                </g>
            </g>
            <!-- Percikan -->
            <g stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round">
                <line x1="282" y1="33" x2="291" y2="28"/>
                <line x1="285" y1="46" x2="295" y2="46"/>
                <line x1="282" y1="59" x2="291" y2="64"/>
            </g>

            <!-- Rak server -->
            <rect x="276" y="78" width="64" height="110" rx="6" fill="#1e3a8a"/>
            <g fill="#2f56b8">
                <rect x="282" y="85" width="52" height="19" rx="3"/>
                <rect x="282" y="110" width="52" height="19" rx="3"/>
                <rect x="282" y="135" width="52" height="19" rx="3"/>
                <rect x="282" y="160" width="52" height="19" rx="3"/>
            </g>
            <g>
                <circle cx="290" cy="94.5" r="2.6" fill="#22c55e"/>
                <circle cx="290" cy="119.5" r="2.6" fill="#fbbf24"/>
                <circle cx="290" cy="144.5" r="2.6" fill="#22c55e"/>
                <circle cx="290" cy="169.5" r="2.6" fill="#f97316"/>
            </g>
            <g stroke="#1e3a8a" stroke-width="2" stroke-linecap="round">
                <line x1="300" y1="94.5" x2="326" y2="94.5"/>
                <line x1="300" y1="119.5" x2="326" y2="119.5"/>
                <line x1="300" y1="144.5" x2="326" y2="144.5"/>
                <line x1="300" y1="169.5" x2="326" y2="169.5"/>
            </g>

            <!-- Monitor -->
            <g transform="translate(10,0)">
                <rect x="108" y="72" width="150" height="104" rx="7" fill="#1f2937"/>
                <rect x="114" y="78" width="138" height="92" rx="3" fill="#ffffff"/>
                <circle cx="122" cy="84" r="2.2" fill="#ef4444"/>
                <circle cx="129" cy="84" r="2.2" fill="#fbbf24"/>
                <circle cx="136" cy="84" r="2.2" fill="#22c55e"/>
                <line x1="114" y1="89.5" x2="252" y2="89.5" stroke="#eef2f7" stroke-width="1"/>

                <!-- Roda gigi kecil di layar -->
                <g transform="translate(183,108) scale(0.5)">
                    <circle r="22" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="6 5.52"/>
                    <circle r="20" fill="#f59e0b"/>
                    <circle r="11" fill="#fff7e6"/>
                    <g transform="rotate(45)">
                        <line x1="0" y1="7" x2="0" y2="-2" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>
                        <path d="M-4.2 -2 A4.6 4.6 0 1 1 4.2 -2" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/>
                    </g>
                </g>

                <text x="183" y="136" text-anchor="middle" font-family="'Segoe UI', Tahoma, Verdana, sans-serif" font-size="9.5" font-weight="700" fill="#0f2a4d">Sistem Sedang</text>
                <text x="183" y="148" text-anchor="middle" font-family="'Segoe UI', Tahoma, Verdana, sans-serif" font-size="9.5" font-weight="700" fill="#0f2a4d">Dalam Pemeliharaan</text>
                <text x="183" y="159" text-anchor="middle" font-family="'Segoe UI', Tahoma, Verdana, sans-serif" font-size="4.6" fill="#64748b">Kami sedang melakukan perbaikan untuk</text>
                <text x="183" y="165" text-anchor="middle" font-family="'Segoe UI', Tahoma, Verdana, sans-serif" font-size="4.6" fill="#64748b">memberikan layanan yang lebih baik.</text>

                <!-- Dudukan -->
                <rect x="172" y="176" width="22" height="10" fill="#374151"/>
                <rect x="150" y="186" width="66" height="6" rx="3" fill="#4b5563"/>
            </g>

            <!-- Kabel kuning -->
            <path d="M250 184 C 266 184, 262 152, 278 152" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

            <!-- Kotak perkakas -->
            <g>
                <path d="M218 168 V161 H242 V168" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
                <rect x="206" y="168" width="48" height="22" rx="3" fill="#fbbf24"/>
                <rect x="206" y="168" width="48" height="7" rx="3" fill="#f59e0b"/>
                <rect x="226" y="172" width="8" height="7" rx="1.5" fill="#1f2937"/>
            </g>

            <!-- Kerucut pengaman kiri -->
            <g transform="translate(-14,0)">
                <rect x="33" y="184" width="38" height="7" rx="2" fill="#3b3b4a"/>
                <polygon points="39,184 65,184 57,132 47,132" fill="#f97316"/>
                <rect x="45" y="128" width="14" height="5" rx="2" fill="#f97316"/>
                <polygon points="44.5,148 59.5,148 60.7,156 43.3,156" fill="#ffffff"/>
                <polygon points="41.8,166 62.2,166 63.5,174 40.5,174" fill="#ffffff"/>
            </g>

            <!-- Kerucut pengaman kanan -->
            <g transform="translate(258,0)">
                <rect x="33" y="184" width="38" height="7" rx="2" fill="#3b3b4a"/>
                <polygon points="39,184 65,184 57,132 47,132" fill="#f97316"/>
                <rect x="45" y="128" width="14" height="5" rx="2" fill="#f97316"/>
                <polygon points="44.5,148 59.5,148 60.7,156 43.3,156" fill="#ffffff"/>
                <polygon points="41.8,166 62.2,166 63.5,174 40.5,174" fill="#ffffff"/>
            </g>

            <!-- Teknisi -->
            <g transform="translate(-12,0)">
                <!-- Kaki belakang (bertumpu di lutut) -->
                <polyline points="98,154 96,184 74,188" fill="none" stroke="#1a2748" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="62" y="183" width="16" height="9" rx="4" fill="#0f172a"/>
                <!-- Kaki depan -->
                <polyline points="100,152 124,154 126,182" fill="none" stroke="#1f2f55" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="120" y="180" width="20" height="9" rx="4" fill="#0f172a"/>
                <!-- Badan -->
                <line x1="101" y1="148" x2="109" y2="124" stroke="#2563eb" stroke-width="26" stroke-linecap="round"/>
                <!-- Lengan -->
                <polyline points="112,124 122,141 136,128" fill="none" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="136" cy="127" r="5" fill="#f2b392"/>
                <!-- Kunci pas -->
                <line x1="137" y1="125" x2="146" y2="109" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
                <circle cx="147.5" cy="106.5" r="4.6" fill="none" stroke="#94a3b8" stroke-width="3"/>
                <!-- Kepala -->
                <circle cx="113" cy="102" r="11" fill="#f2b392"/>
                <circle cx="118" cy="102" r="1.3" fill="#1f2937"/>
                <path d="M115 107 Q118 109.5 121 106.5" fill="none" stroke="#b4573a" stroke-width="1.2" stroke-linecap="round"/>
                <!-- Topi -->
                <path d="M100.5 99 A12.5 12.5 0 0 1 125.5 99 Z" fill="#1d4ed8"/>
                <ellipse cx="127" cy="99.5" rx="8" ry="2.6" fill="#1e40af"/>
                <circle cx="113" cy="87" r="1.6" fill="#1e40af"/>
            </g>
        </svg>

        <h1>SIAKAD sedang dalam pemeliharaan sistem</h1>

        <p>Untuk meningkatkan kualitas layanan, mohon maaf saat ini SIAKAD tidak dapat diakses.</p>

        <!-- ====== EDIT JADWAL AKSES KEMBALI DI SINI ====== -->
        <div class="info-box">
            Silakan mengakses kembali SIAKAD pada :
            <strong>Senin, 19 Oktober 2026 mulai jam 06:00 WIB</strong>
        </div>
        <!-- =============================================== -->

        <p>Terima kasih atas pengertiannya.</p>

    </main>

</body>
</html>
